openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Petron Radar API - Plataforma SaaS de Inteligência em Petróleo, Óleo & Gás
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard metrics and summary
  - name: opportunities
    description: Business opportunities in Oil & Gas
  - name: bulletins
    description: Intelligence bulletins
  - name: clients
    description: Client management
  - name: plans
    description: Subscription plans
  - name: inquiries
    description: Lead capture and inquiry management
  - name: petroconnect
    description: Petroconnect platform integration
  - name: beta-clients
    description: Beta client program management

paths:
  /petroconnect/public-import/status:
    get:
      operationId: getPetronectPublicImportStatus
      responses:
        "200":
          description: Public-list import status and explicit field limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetronectPublicImportStatus"
  /petroconnect/public-import/runs:
    get:
      operationId: getPetronectPublicImportRuns
      responses:
        "200":
          description: Recent administrative import attempts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PetronectPublicImportRun" }
  /petroconnect/public-import/runs/{id}:
    get:
      operationId: getPetronectPublicImportRun
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Saved review preview for resuming or applying an import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetronectPublicImportRunPreview"
        "404": { description: Import run not found }
  /petroconnect/public-import/opportunities:
    get:
      operationId: getPetronectPublicOpportunities
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Imported public listing records only, values and sectors are absent
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PetronectPublicOpportunity" }
  /petroconnect/public-import/changes:
    get:
      operationId: getPetronectPublicOpportunityChanges
      responses:
        "200":
          description: Audited additions and public-field revisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PetronectPublicChange" }
  /petroconnect/public-import/preview:
    post:
      operationId: previewPetronectPublicImport
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string, maxLength: 5000000 }
          text/plain:
            schema: { type: string, maxLength: 5000000 }
      responses:
        "201":
          description: Validated preview; no opportunity records changed yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PetronectPublicImportPreview" }
        "400":
          description: Invalid CSV; the failed attempt is logged
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: integer }
                  error: { type: string }
  /petroconnect/public-import/runs/{id}/apply:
    post:
      operationId: applyPetronectPublicImport
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reviewed import applied idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PetronectPublicImportApplyResult" }
        "404": { description: Import run not found }
        "409": { description: Saved preview unavailable }
        "500": { description: Failure logged; preview retained for retry }
  /payments/recovery:
    get:
      operationId: getPaymentRecovery
      responses:
        "200":
          description: Payment metadata bound to an HttpOnly recovery receipt; no bearer secrets
          content:
            application/json:
              schema:
                type: object
                required: [recovery]
                properties:
                  recovery:
                    type: [object, "null"]
                    required: [paymentId, planSlug, status, googleRequired]
                    properties:
                      paymentId: { type: integer }
                      planSlug: { type: string }
                      status: { type: string }
                      googleRequired: { type: boolean }
  /auth/options:
    get:
      operationId: getAuthOptions
      responses:
        "200":
          description: Available sign-in methods
          content:
            application/json:
              schema:
                type: object
                required: [googleAvailable]
                properties:
                  googleAvailable: { type: boolean }
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications belonging to the signed-in user
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401": { description: Authentication required }
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one of the signed-in user's notifications as read
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400": { description: Invalid notification ID }
        "404": { description: Notification not found for this user }
        "401": { description: Authentication required }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all of the signed-in user's notifications as read
      responses:
        "200":
          description: Number of notifications updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkAllNotificationsReadResult"
        "401": { description: Authentication required }
  /auth/register:
    post:
      operationId: registerCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Pending registration, no account or product access created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
        "200":
          description: Existing pending registration reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationResult"
        "400": { description: Invalid input }
        "409": { description: Registration conflict }
        "429": { description: Too many attempts }
  /auth/registration:
    get:
      operationId: getRegistration
      responses:
        "200":
          description: Browser-session-owned pending registration
          content:
            application/json:
              schema:
                type: object
                required: [registration, googleEmail]
                properties:
                  googleEmail: { type: [string, "null"] }
                  registration:
                    type: [object, "null"]
                    additionalProperties: true
  /auth/google/start:
    get:
      operationId: startGoogle
      parameters:
        - in: query
          name: purpose
          schema: { type: string, enum: [login, register, link, reauth] }
        - in: query
          name: next
          schema: { type: string }
      responses:
        "302": { description: Redirect to Google or local configuration error }
        "400": { description: Invalid purpose }
        "429": { description: Too many attempts }
  /auth/google/callback:
    get:
      operationId: googleCallback
      parameters:
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: error
          schema: { type: string }
      responses:
        "302": { description: One-time callback; redirect to safe local destination }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401": { description: Authentication required }

  /dashboard/recent-activity:
    get:
      operationId: getDashboardRecentActivity
      tags: [dashboard]
      summary: Recent platform activity feed
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
        "401": { description: Authentication required }

  /dashboard/search:
    get:
      operationId: searchDashboard
      tags: [dashboard]
      summary: Search dashboard catalog items
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 80
      responses:
        "200":
          description: Matching opportunities, bulletins and administrator-only client records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardSearchResult"
        "400": { description: Search query is invalid }
        "401": { description: Authentication required }

  /dashboard/sector-breakdown:
    get:
      operationId: getDashboardSectorBreakdown
      tags: [dashboard]
      summary: Opportunities by sector/segment
      responses:
        "200":
          description: Sector breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SectorStat"
        "401": { description: Authentication required }

  /opportunities:
    get:
      operationId: listOpportunities
      tags: [opportunities]
      summary: List Oil & Gas opportunities
      parameters:
        - name: sector
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
    post:
      operationId: createOpportunity
      tags: [opportunities]
      summary: Create a new opportunity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityInput"
      responses:
        "201":
          description: Created opportunity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [opportunities]
      summary: Get opportunity by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Opportunity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Opportunity"

  /opportunities/{id}/documents:
    get:
      operationId: listOpportunityDocuments
      tags: [opportunities]
      summary: List curated links and official document review status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Opportunity documents and latest review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityDocumentsState"
        "401": { description: Authentication required }
        "404": { description: Opportunity not found }
    post:
      operationId: createOpportunityDocument
      tags: [opportunities]
      summary: Add a curated document link to an opportunity
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityDocumentInput" }
      responses:
        "201":
          description: Curated link added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityDocument" }
        "400": { description: Invalid link or input }
        "403": { description: Petron team access required }
        "404": { description: Opportunity not found }

  /opportunities/{id}/documents/review:
    post:
      operationId: reviewOpportunityDocuments
      tags: [opportunities]
      summary: Record that all opportunity document links were checked
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpportunityDocumentReviewInput" }
      responses:
        "200":
          description: Official document review recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityDocumentReview" }
        "403": { description: Petron team access required }
        "404": { description: Opportunity or source link not found }
        "409": { description: Source link or documents have not all been tested }

  /opportunities/documents/{docId}/test:
    post:
      operationId: markOpportunityDocumentTested
      tags: [opportunities]
      summary: Record a manual test of a curated document link
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Link test recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityDocument" }
        "403": { description: Petron team access required }
        "404": { description: Document link not found }

  /opportunities/documents/{docId}:
    delete:
      operationId: deleteOpportunityDocument
      tags: [opportunities]
      summary: Remove a curated document link
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document link removed
        "403": { description: Petron team access required }
        "404": { description: Document link not found }

  /bulletins:
    get:
      operationId: listBulletins
      tags: [bulletins]
      summary: List intelligence bulletins
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of bulletins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bulletin"
    post:
      operationId: createBulletin
      tags: [bulletins]
      summary: Create a bulletin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulletinInput"
      responses:
        "201":
          description: Created bulletin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulletin"

  /bulletins/{id}:
    get:
      operationId: getBulletin
      tags: [bulletins]
      summary: Get bulletin by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bulletin detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bulletin"

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /inquiries:
    get:
      operationId: listInquiries
      tags: [inquiries]
      summary: List all inquiries/leads
      responses:
        "200":
          description: List of inquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inquiry"
    post:
      operationId: createInquiry
      tags: [inquiries]
      summary: Submit a new inquiry (lead capture)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "201":
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /inquiries/{id}:
    get:
      operationId: getInquiry
      tags: [inquiries]
      summary: Get inquiry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Inquiry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /inquiries/{id}/convert:
    post:
      operationId: convertInquiryToClient
      tags: [inquiries]
      summary: Convert a lead inquiry into a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Client created from inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /inquiries/{id}/status:
    patch:
      operationId: updateInquiryStatus
      tags: [inquiries]
      summary: Update inquiry lead status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryStatusUpdate"
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inquiry"

  /petroconnect/status:
    get:
      operationId: getPetroconnectStatus
      tags: [petroconnect]
      summary: Get Petroconnect integration status
      responses:
        "200":
          description: Petroconnect integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetroconnectStatus"

  /petroconnect/connect:
    post:
      operationId: connectPetroconnect
      tags: [petroconnect]
      summary: Initiate Petroconnect connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetroconnectConnectInput"
      responses:
        "200":
          description: Connection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetroconnectStatus"

  /petroconnect/sync:
    post:
      operationId: triggerPetroconnectSync
      tags: [petroconnect]
      summary: Trigger a manual sync with Petroconnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetroconnectSyncInput"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetroconnectSyncResult"

  /petroconnect/sync-log:
    get:
      operationId: getPetroconnectSyncLog
      tags: [petroconnect]
      summary: Get recent Petroconnect sync history
      responses:
        "200":
          description: List of sync log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PetroconnectSyncLogEntry"

  /beta-clients:
    get:
      operationId: listBetaClients
      tags: [beta-clients]
      summary: List all beta clients
      responses:
        "200":
          description: List of beta clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BetaClient"
    post:
      operationId: createBetaClient
      tags: [beta-clients]
      summary: Create a beta client record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetaClientInput"
      responses:
        "201":
          description: Beta client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaClient"

  /beta-clients/{id}:
    get:
      operationId: getBetaClient
      tags: [beta-clients]
      summary: Get beta client by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Beta client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaClient"
    patch:
      operationId: updateBetaClient
      tags: [beta-clients]
      summary: Update beta client fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BetaClientPatch"
      responses:
        "200":
          description: Updated beta client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetaClient"

  /beta-clients/{id}/checklist/{itemId}:
    patch:
      operationId: updateBetaClientChecklistItem
      tags: [beta-clients]
      summary: Toggle a checklist item for a beta client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistItemPatch"
      responses:
        "200":
          description: Updated checklist item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistItem"

  /radar360/profiles:
    get:
      operationId: listRadar360Profiles
      tags: [radar360]
      summary: List profiles visible to the current user
      responses:
        "200":
          description: Profiles visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radar360Profile" }
    post:
      operationId: createRadar360Profile
      tags: [radar360]
      summary: Create a profile for an existing company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Radar360ProfileInput" }
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Profile" }

  /radar360/profiles/bootstrap:
    post:
      operationId: bootstrapRadar360References
      tags: [radar360]
      summary: Add missing historical references without linking accounts
      responses:
        "200":
          description: Bootstrap result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360BootstrapResult" }

  /radar360/profiles/{id}:
    patch:
      operationId: updateRadar360Profile
      tags: [radar360]
      summary: Update a profile's matching and cadence settings
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Radar360ProfileUpdate" }
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Profile" }

  /radar360/profiles/{id}/link:
    post:
      operationId: linkRadar360Profile
      tags: [radar360]
      summary: Confirm a historical profile's company match
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Radar360ProfileLinkInput" }
      responses:
        "200":
          description: Linked profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Profile" }

  /radar360/reconciliation:
    get:
      operationId: getRadar360Reconciliation
      tags: [radar360]
      summary: Compare historical references with existing company accounts
      responses:
        "200":
          description: Reconciliation view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Reconciliation" }

  /radar360/source-status:
    get:
      operationId: getRadar360SourceStatus
      tags: [radar360]
      summary: Show real source and import availability
      responses:
        "200":
          description: Available sources and their limitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radar360SourceStatus" }

  /radar360/events:
    get:
      operationId: listRadar360Events
      tags: [radar360]
      summary: List recent private scan and import events
      parameters:
        - name: profileId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Private execution and error history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radar360Event" }

  /radar360/imports:
    get:
      operationId: listRadar360Imports
      tags: [radar360]
      summary: List imports visible to the current user
      parameters:
        - name: profileId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Import history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radar360Import" }

  /radar360/imports/preview:
    post:
      operationId: previewRadar360Import
      tags: [radar360]
      summary: Validate an opportunity list before importing it
      parameters:
        - name: profileId
          in: query
          required: true
          schema: { type: integer }
        - name: sourceName
          in: query
          required: true
          schema: { type: string }
        - name: fileName
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        "201":
          description: Import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360ImportPreview" }

  /radar360/imports/{id}/apply:
    post:
      operationId: applyRadar360Import
      tags: [radar360]
      summary: Apply a reviewed import idempotently
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Import application result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Import" }

  /radar360/runs:
    get:
      operationId: listRadar360Runs
      tags: [radar360]
      summary: List private editions visible to the current user
      parameters:
        - name: profileId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Edition history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radar360RunSummary" }
    post:
      operationId: createRadar360Run
      tags: [radar360]
      summary: Generate a draft edition from selected available sources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Radar360RunInput" }
      responses:
        "201":
          description: Generated draft or ready edition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Run" }

  /radar360/runs/{id}:
    get:
      operationId: getRadar360Run
      tags: [radar360]
      summary: Get a scoped edition and its opportunity details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Edition details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Run" }

  /radar360/runs/{id}/resume:
    post:
      operationId: resumeRadar360Run
      tags: [radar360]
      summary: Resume a failed or incomplete edition without duplicating it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Resumed edition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Run" }

  /radar360/runs/{id}/publish:
    post:
      operationId: publishRadar360Run
      tags: [radar360]
      summary: Publish a validated edition to its private company area
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Published edition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360Run" }

  /radar360/runs/{id}/image:
    get:
      operationId: getRadar360RunImage
      tags: [radar360]
      summary: Serve the private image generated for an edition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Generated SVG image
          content:
            image/svg+xml:
              schema: { type: string }

  /radar360/files:
    get:
      operationId: listRadar360Files
      tags: [radar360]
      summary: List private profile documents and identity files
      parameters:
        - name: profileId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Private files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Radar360File" }

  /radar360/files/upload-url:
    post:
      operationId: requestRadar360FileUpload
      tags: [radar360]
      summary: Request a private upload URL for a profile file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Radar360FileUploadInput" }
      responses:
        "200":
          description: Temporary upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360FileUploadResponse" }

  /radar360/files/{id}/complete:
    post:
      operationId: completeRadar360FileUpload
      tags: [radar360]
      summary: Confirm and validate an uploaded private file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Uploaded file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360File" }

  /radar360/files/{id}/verify:
    patch:
      operationId: verifyRadar360CapabilityFile
      tags: [radar360]
      summary: Mark capability evidence as reviewed by an administrator
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Radar360FileVerificationInput" }
      responses:
        "200":
          description: Updated file review status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Radar360File" }

  /radar360/files/{id}/download:
    get:
      operationId: downloadRadar360File
      tags: [radar360]
      summary: Download a private profile file
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Private file bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }

components:
  schemas:
    Notification:
      type: object
      required: [id, kind, title, message, href, createdAt, readAt]
      properties:
        id: { type: integer }
        kind: { type: string }
        title: { type: string }
        message: { type: string }
        href: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unreadCount: { type: integer }
    MarkAllNotificationsReadResult:
      type: object
      required: [updatedCount]
      properties:
        updatedCount: { type: integer }
    PetronectPublicImportStatus:
      type: object
      required: [status, importedCount, lastRun, source, limitations]
      properties:
        status: { type: string, enum: [not_configured, pending, success, failure] }
        importedCount: { type: integer }
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/PetronectPublicImportRun"
            - type: "null"
        source: { type: string }
        limitations:
          type: object
          required: [value, sector, documents]
          properties:
            value: { type: string }
            sector: { type: string }
            documents: { type: string }
    PetronectPublicImportRun:
      type: object
      required: [id, fileName, status, totalRows, newRows, updatedRows, unchangedRows, duplicateRows, invalidRows, errorMessage, createdAt, completedAt]
      properties:
        id: { type: integer }
        fileName: { type: [string, "null"] }
        status: { type: string, enum: [pending, success, failed] }
        totalRows: { type: integer }
        newRows: { type: integer }
        updatedRows: { type: integer }
        unchangedRows: { type: integer }
        duplicateRows: { type: integer }
        invalidRows: { type: integer }
        errorMessage: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
    PetronectPublicPreviewRow:
      type: object
      required: [rowNumber, petronectId, title, subStatus, company, scope, startDate, endDate, processType, deliveryLocation, error, action]
      properties:
        rowNumber: { type: integer }
        petronectId: { type: string }
        title: { type: string }
        subStatus: { type: [string, "null"] }
        company: { type: [string, "null"] }
        scope: { type: [string, "null"] }
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
        processType: { type: [string, "null"] }
        deliveryLocation: { type: [string, "null"] }
        error: { type: [string, "null"] }
        action: { type: string, enum: [new, updated, unchanged, duplicate, invalid] }
    PetronectPublicImportPreview:
      type: object
      required: [runId, totalRows, newRows, updatedRows, unchangedRows, duplicateRows, invalidRows, preview]
      properties:
        runId: { type: integer }
        totalRows: { type: integer }
        newRows: { type: integer }
        updatedRows: { type: integer }
        unchangedRows: { type: integer }
        duplicateRows: { type: integer }
        invalidRows: { type: integer }
        preview:
          type: array
          items: { $ref: "#/components/schemas/PetronectPublicPreviewRow" }
    PetronectPublicImportRunPreview:
      allOf:
        - $ref: "#/components/schemas/PetronectPublicImportRun"
        - type: object
          required: [preview]
          properties:
            preview:
              type: array
              items: { $ref: "#/components/schemas/PetronectPublicPreviewRow" }
    PetronectPublicImportApplyResult:
      type: object
      properties:
        complete: { type: boolean }
        run: { $ref: "#/components/schemas/PetronectPublicImportRun" }
        totals:
          type: object
          properties:
            newRows: { type: integer }
            updatedRows: { type: integer }
            unchangedRows: { type: integer }
            duplicateRows: { type: integer }
            invalidRows: { type: integer }
    PetronectPublicOpportunity:
      type: object
      required: [id, petronectId, title, subStatus, company, scope, startDate, endDate, processType, deliveryLocation, lastImportRunId, sourceFirstSeenAt, sourceUpdatedAt, value, sector]
      properties:
        id: { type: integer }
        petronectId: { type: string }
        title: { type: string }
        subStatus: { type: [string, "null"] }
        company: { type: [string, "null"] }
        scope: { type: [string, "null"] }
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
        processType: { type: [string, "null"] }
        deliveryLocation: { type: [string, "null"] }
        lastImportRunId: { type: [integer, "null"] }
        sourceFirstSeenAt: { type: string, format: date-time }
        sourceUpdatedAt: { type: string, format: date-time }
        value: { type: "null" }
        sector: { type: "null" }
    PetronectPublicChange:
      type: object
      properties:
